version: "1.0"

# 功率映射研究矩阵（Task 8）。矩阵点是候选研究点，不代表全部可用。
# 只有真实收敛、达到稳态且通过有效性检查的点才允许进入映射。
inputs_voltage_v: [9.0, 9.6, 10.5, 11.1, 12.0, 12.6]
load_currents_a: [0.5, 1.0, 1.5, 2.0]

power_stage:
  inductance_h: 47.0e-6
  capacitance_f: 100.0e-6
  inductor_dcr_ohm: 0.05
  capacitor_esr_ohm: 0.03
  switching_frequency_hz: 100000
  target_output_voltage_v: 5.0

controller:
  kp: 0.0585
  ki: 117.66
  variant: E
  source: "PowerLab configs/controller_config.yaml 原控制器"

simulation:
  end_time_s: 0.004
  step_time_s: 5.0e-8
  max_step_time_s: 5.0e-8
  steady_window_fraction: 0.35

validity:
  require_converged: true
  require_steady_state: true
  output_voltage_tolerance_v: 0.1
  require_ccm: true
  forbid_extrapolation: true

generated_map: null
generated_run_id: null
