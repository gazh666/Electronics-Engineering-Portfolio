temperature_extension:
  temperatures_c: [0, 45]
  available: false
  status: NOT_VERIFIED
  reason: 已下载的 CALCE 公开数据仅覆盖 25℃ 标称环境温度，未获取 0℃ 与 45℃ 实验文件。

rules:
  allow_validation_refitting: false
  allow_random_row_split: false
  allow_unverified_cell_identity: true
  cell_identity_note: >
    OCV 来自 SP1，动态工况与容量来自 SP2，增量 OCV 来自 SP3。三者是同一型号 INR18650-20R
    的不同官方样品。因此本阶段结论属于“同型号跨样品参考模型”，不是同一颗电芯的完整辨识。
  initial_soc_method: recorded_capacity_balance
  initial_soc_note: >
    动态工况开始前文件内已完成满充并静置，使用文件自身记录的累计放电容量 qd 与 SP2 实测容量计算
    SOC0 = 1 - qd_start / Q_measured。不使用验证波形反向调整 SOC0。
