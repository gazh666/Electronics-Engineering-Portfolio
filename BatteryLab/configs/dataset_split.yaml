version: "1.0"
description: >
  BatteryLab 第三阶段数据划分。所有条目关联 data/manifests/dataset_manifest.json 中的真实
  CALCE 公开实验文件与 SHA256。数据来源类型统一为 public_experimental_data。

primary_temperature_c: 25

cell_model: INR18650-20R
chemistry: LiNiMnCo/Graphite
nominal_capacity_ah: 2.0
citation: >
  CALCE Battery Data, Center for Advanced Life Cycle Engineering, University of Maryland,
  https://calce.umd.edu/battery-data (accessed 2026-11-26).

