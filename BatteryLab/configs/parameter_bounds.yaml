parameter_source: identification_search_bounds
description: >
  参数辨识搜索边界。数值结合真实采样间隔（约 1.0 s / 10.0 s）、脉冲与静置时长以及
  INR18650-20R 的合理物理量级设定；不是 Samsung 官方电气参数。

r0_ohm:
  minimum: 0.005
  maximum: 0.150
  reason: 18650 动力电芯 25℃ 欧姆内阻典型量级 15–40 mΩ，边界放宽到 5–150 mΩ。

r1_ohm:
  minimum: 0.001
  maximum: 0.080
  reason: 快速极化电阻通常小于欧姆内阻。

r2_ohm:
  minimum: 0.001
  maximum: 0.080
  reason: 慢速极化电阻，量级与 R1 相近或更小。

tau1_s:
  minimum: 5.0
  maximum: 300.0
  reason: 原始数据最长以 10 s 间隔采样；小于 5 s 的时间常数不可辨识。

tau2_s:
  minimum: 100.0
  maximum: 5000.0
  reason: 静置段约 7200 s，可支撑约 5000 s 的慢时间常数上限。

constraints:
  positive_resistance: true
  positive_capacitance: true
  ordered_time_constants: true
  require_finite_parameters: true
  reject_zero_or_negative: true

scaling:
  method: log10
  note: 电阻与时间常数跨数量级，优化时对 R1/R2/tau1/tau2 使用对数参数化。
