version: "1.0"

# 第五阶段保护阈值来源：
# 1) 电芯模型：第三阶段 CALCE SP2 / INR18650-20R 冻结参数；
# 2) 模型有效域：OCV 查表覆盖 SOC 0-1，单体端电压参考 3.0-4.2 V；
# 3) 采集有效域：第四阶段 AFE 单体测量范围 2.5-4.25 V；
# 4) 工程需求：阈值必须在采集可分辨范围内，且不能低于模型参考上限。
# 以上阈值是教学设计值，不是任何商业保护 IC 的出厂参数。
parameter_source: engineering_design_from_identified_cell_and_model_domain

cell_reference:
  model: INR18650-20R
  capacity_ah: 2.0280827046460144
  model_soc_min: 0.0
  model_soc_max: 1.0
  model_terminal_reference_min_v: 3.0
  model_terminal_reference_max_v: 4.2
  afe_measurement_min_v: 2.5
  afe_measurement_max_v: 4.25
  stage3_observed_cell_min_v: 2.4034
  stage3_observed_cell_max_v: 4.2001

limits:
  # 过压：4.25 V = 采集上限，且高于模型参考上限 4.20 V 50 mV。
  cell_overvoltage_trip_v: 4.25
  cell_overvoltage_release_v: 4.15
  # 欠压：2.80 V 高于采集下限 2.5 V，低于模型参考下限 3.0 V。
  cell_undervoltage_trip_v: 2.80
  cell_undervoltage_release_v: 3.00
  # 充电过流：1.5x 额定 1C（2.03 Ah）以内，且覆盖第六阶段 1 A 恒流。
  charge_overcurrent_trip_a: 1.50
  charge_overcurrent_release_a: 1.30
  # 放电过流：约 2C，低于第三阶段实验最大放电 4.002 A 的 1.05 倍边界。
  discharge_overcurrent_trip_a: 4.00
  discharge_overcurrent_release_a: 3.60
  # 短路：两方向共用。
  short_circuit_trip_a: 8.00
  short_circuit_release_a: 6.00
  # 温度：NTC 量程 0-60 ℃；充电禁止区间 0-45 ℃；OTP 65 ℃ 需外推。
  over_temperature_trip_c: 65.0
  over_temperature_release_c: 55.0
  charge_temperature_min_c: 0.0
  charge_temperature_max_c: 45.0
  discharge_temperature_min_c: -20.0
  discharge_temperature_max_c: 60.0
  temperature_release_margin_c: 5.0

timing:
  overvoltage_delay_s: 0.05
  undervoltage_delay_s: 0.10
  charge_overcurrent_delay_s: 0.50
  discharge_overcurrent_delay_s: 0.20
  short_circuit_delay_s: 0.005
  over_temperature_delay_s: 2.00
  under_temperature_delay_s: 2.00
  comparator_propagation_delay_s: 0.001
  measurement_max_age_s: 0.05
  simulation_step_s: 0.0005

recovery:
  all_clear_hold_s: 5.0
  require_measurement_valid: true
  automatic_restart: false

mosfet_switch:
  model: back_to_back_n_channel_common_source_low_side
  rds_on_target_ohm: 0.020
  body_diode_saturation_current_a: 1.0e-9
  gate_drive_voltage_v: 10.0
  gate_resistance_ohm: 10.0
  gate_pulldown_ohm: 100000.0
  gate_charge_nc: 20.0
  switching_frequency_hz: 100000.0
  driver_supply_v: 12.0
  drain_access_resistance_ohm: 0.008
  source_access_resistance_ohm: 0.004
  thermal_resistance_c_per_w: 40.0

comparator:
  divider_ratio: 0.5
  propagation_delay_s: 0.001
  noise_rms_v: 0.002
  overvoltage_spice_threshold_v: 2.125
  overvoltage_spice_hysteresis_v: 0.050
  undervoltage_spice_threshold_v: 1.400
  undervoltage_spice_hysteresis_v: 0.100

balancing:
  method: passive_resistor_dissipation
  resistor_ohm: 100.0
  mosfet_rds_on_ohm: 0.04
  start_cell_voltage_v: 4.10
  start_delta_v: 0.030
  stop_delta_v: 0.010
  max_simultaneous_cells: 1
  allowed_only_when_charging_or_rest: true
  resistor_power_rating_w: 0.25
  resistor_thermal_resistance_c_per_w: 200.0
  ambient_temperature_c: 25.0
  balancing_step_s: 10.0

metadata:
  hardware_validation_available: false
  real_protection_ic_model_verified: false
