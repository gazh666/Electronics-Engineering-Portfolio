version: "1.0"

source_type: educational_design

battery:
  series_cells: 3
  capacity_source: identified_model
  fallback_capacity_ah: 2.0

current_sign:
  discharge_positive: true

soc_estimation:
  initial_soc: 0.6
  charge_coulombic_efficiency: 1.0
  discharge_coulombic_efficiency: 1.0
  maximum_sample_gap_s: 2.0
  bound_policy: report_and_limit

rest_detection:
  maximum_absolute_current_a: 0.02
  minimum_rest_time_s: 300
  maximum_voltage_slope_v_per_s: 0.00002
  slope_window_s: 30

ocv_correction:
  enabled: true
  correction_weight: 0.2
  correction_interval_s: 60
  maximum_correction_per_update: 0.02
  minimum_ocv_slope_v_per_soc: 0.2

validation:
  random_seed: 42
  initial_soc_errors_pp:
    - -20
    - -10
    - 0
    - 10
    - 20

metadata:
  hardware_validation_available: false
