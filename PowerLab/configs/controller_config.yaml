version: "1.0"
specification_type: project_assumption

# PI 初值来自 control.controller_tuning 的 3x3 矩阵筛选结果：
# 基础设计 fc=600 Hz、fz=80 Hz；候选 kp=0.0585、ki=117.66 在平均模型中
# 给出约 62 deg 相位裕量与约 57 Hz 闭环带宽，并已用真实 SPICE 短时验证。
design:
  base_crossover_hz: 600.0
  base_zero_hz: 80.0
  selected_candidate: "0.5x kp, 2.0x ki"
  selected_candidate_phase_margin_deg: 62.0
  selected_candidate_bandwidth_hz: 57.3
  note: "教学初始设计目标，不是商业电源最优整定"

controller:
  kp: 0.0585
  ki: 117.66
  duty_min: 0.02
  duty_max: 0.90
  feedforward_enabled: true
  anti_windup: back_calculation
  tracking_gain: 2000.0
  vin_min_for_feedforward_v: 2.0

soft_start:
  enabled: true
  duration_s: 0.002
  initial_reference_v: 0.0

carrier:
  carrier_type: sine
  frequency_hz: 100000.0
  smoothing_width: 0.02
  threshold: 0.5
