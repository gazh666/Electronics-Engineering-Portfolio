# 工程性能限值（教学项目自定义假设）
#
# 重要：这些限值不是国家标准、行业标准或任何真实芯片的数据手册规格。
# 它们只用于演示测试软件的限值判定流程，修改后无需改算法代码。
profile:
  name: "Virtual 12V-to-5V Buck Test"
  specification_type: "project_assumption"

  nominal_output_voltage: 5.0

  output_voltage:
    min_v: 4.9
    max_v: 5.1

  voltage_error:
    max_absolute_percent: 2.0

  efficiency:
    min_percent: 85.0
    max_percent: 100.0

  load_regulation:
    max_percent: 1.0

  line_regulation:
    max_percent: 1.0

  data_quality:
    power_balance_absolute_tolerance_w: 0.000001
    power_balance_relative_tolerance: 0.000001

  notes:
    - "All limits are educational project assumptions."
    - "These limits do not represent a verified commercial datasheet."
