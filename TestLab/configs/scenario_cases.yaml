# 旧版“字典用例”配置（保留给阶段四~六的 ScenarioTestRunner / scripts.demo）
#
# 阶段七起，自动化执行引擎使用 configs/test_cases.yaml（新结构）：
#   - 用例字段：category / input_current_limit / limits
#   - 方案字段：test_suites.yaml
# 本文件仅用于回归验证旧执行路径，不参与新引擎。
#
# 所有结果均为仿真结果，不代表真实硬件测量。

spec: "1.0"

defaults:
  settle_time_s: 0.02
  sample_count: 3
  max_retries: 2

test_cases:
  # 1. 标称输入电压
  - id: TC001
    name: 标称输入电压测试
    vin: 12.0
    load_current: 1.0
    enabled: true
    expected_state: NORMAL
    voltage_min: 4.9
    voltage_max: 5.1

  # 2. 最低输入电压（模型下限 9 V，含边界）
  - id: TC002
    name: 最低输入电压测试
    vin: 9.0
    load_current: 1.0
    enabled: true
    expected_state: NORMAL
    voltage_min: 4.9
    voltage_max: 5.1

  # 3. 最高输入电压（模型上限 16 V，含边界）
  - id: TC003
    name: 最高输入电压测试
    vin: 16.0
    load_current: 1.0
    enabled: true
    expected_state: NORMAL
    voltage_min: 4.9
    voltage_max: 5.1

  # 4. 空载
  - id: TC004
    name: 空载测试
    vin: 12.0
    load_current: 0.0
    load_enabled: false
    enabled: true
    expected_state: NORMAL
    voltage_min: 4.9
    voltage_max: 5.1

  # 5. 轻载
  - id: TC005
    name: 轻载测试
    vin: 12.0
    load_current: 0.5
    enabled: true
    expected_state: NORMAL
    voltage_min: 4.9
    voltage_max: 5.1

  # 6. 满载（模型最大输出 2 A，含边界）
  - id: TC006
    name: 满载测试
    vin: 12.0
    load_current: 2.0
    enabled: true
    expected_state: NORMAL
    voltage_min: 4.9
    voltage_max: 5.1

  # 7. 模拟过流保护
  - id: TC007
    name: 模拟过流保护测试
    vin: 12.0
    load_current: 2.5
    enabled: true
    expected_state: OVERCURRENT
    voltage_min: 0.0
    voltage_max: 0.0

  # 8. 模拟欠压保护
  - id: TC008
    name: 模拟欠压保护测试
    vin: 8.0
    load_current: 1.0
    enabled: true
    expected_state: UNDERVOLTAGE
    voltage_min: 0.0
    voltage_max: 0.0

  # 9. 模拟过压保护
  - id: TC009
    name: 模拟过压保护测试
    vin: 17.0
    load_current: 1.0
    enabled: true
    expected_state: OVERVOLTAGE
    voltage_min: 0.0
    voltage_max: 0.0

  # 10. 输出关闭（DUT 使能关闭，优先级最高）
  - id: TC010
    name: 输出关闭测试
    vin: 12.0
    load_current: 1.0
    output_enabled: false
    enabled: true
    expected_state: OUTPUT_OFF
    voltage_min: 0.0
    voltage_max: 0.0

  # 11. 模拟通信超时：首次读取超时，有限重试后恢复
  - id: TC011
    name: 模拟通信超时测试
    vin: 12.0
    load_current: 1.0
    enabled: true
    expected_state: NORMAL
    voltage_min: 4.9
    voltage_max: 5.1
    max_retries: 2
    fault:
      type: communication_timeout
      location: dut_bridge.acquire
      times: 1

  # 12. 非法数据：首次返回非法字符串响应，有限重试后恢复
  - id: TC012
    name: 非法数据测试
    vin: 12.0
    load_current: 1.0
    enabled: true
    expected_state: NORMAL
    voltage_min: 4.9
    voltage_max: 5.1
    max_retries: 2
    fault:
      type: invalid_response
      location: dut_bridge.acquire
      times: 1
